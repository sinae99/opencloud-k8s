apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-storage
          image: opencloudeu/opencloud:7.2.4
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              mkdir -p "${OC_CONFIG_DIR}" "${OC_BASE_DATA_PATH}";
              chown -R 1000:1000 /var/lib/opencloud
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secrets
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: opencloud-data
              mountPath: /var/lib/opencloud
      containers:
        - name: opencloud
          image: opencloudeu/opencloud:7.2.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until [ -f "${OC_CONFIG_DIR}/opencloud.yaml" ]; do
                echo "Waiting for the opencloud-init Job";
                sleep 2;
              done;
              exec opencloud server
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secrets
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: debug
              containerPort: 9205
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: debug
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: debug
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: debug
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: opencloud-data
              mountPath: /var/lib/opencloud
      volumes:
        - name: opencloud-data
          persistentVolumeClaim:
            claimName: opencloud-data

