apiVersion: batch/v1
kind: Job
metadata:
  name: opencloud-init
  namespace: opencloud
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-storage
          image: opencloudeu/opencloud:7.2.4
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              mkdir -p "${OC_CONFIG_DIR}" "${OC_BASE_DATA_PATH}";
              chown -R 1000:1000 /var/lib/opencloud
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secrets
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: opencloud-data
              mountPath: /var/lib/opencloud
      containers:
        - name: opencloud-init
          image: opencloudeu/opencloud:7.2.4
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              if [ -f "${OC_CONFIG_DIR}/opencloud.yaml" ]; then
                echo "OpenCloud is already initialized";
                exit 0;
              fi;
              exec opencloud init
          envFrom:
            - configMapRef:
                name: opencloud-config
            - secretRef:
                name: opencloud-secrets
          volumeMounts:
            - name: opencloud-data
              mountPath: /var/lib/opencloud
      volumes:
        - name: opencloud-data
          persistentVolumeClaim:
            claimName: opencloud-data

